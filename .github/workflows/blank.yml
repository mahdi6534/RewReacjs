name: Windows RDP Debugging

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 60 # Standard jobs can run up to 6 hours, keep short for debugging

    steps:
      - name: Set Up RDP and Tunnel
        shell: bash
        run: |
          # Set administrator password
          net user runneradmin "P@ssw0rd1234!"

          # Download and install ngrok
          curl -sSfL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -o ngrok.zip
          tar -xf ngrok.zip

          # Authenticate ngrok
          ./ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

          # Start ngrok RDP tunnel in the background
          start ./ngrok.exe tcp 3389

          # Wait 5 seconds for tunnel to register
          sleep 5

          # Retrieve public address
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
      
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "RDP session ready. Runner will stay alive for 1 hour..."
          sleep 3600
