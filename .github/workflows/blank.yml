steps:
      - name: Set Up RDP and Tunnel
        shell: powershell
        run: |
          # 1. Set admin password
          net user runneradmin "P@ssw0rd1234!"

          # 2. Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 3. Direct Download Official ngrok (fast, bypasses choco)
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "$PWD" -Force

          # 4. Authenticate ngrok
          .\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

          # 5. Launch ngrok with logging enabled
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log"

          # 6. Polling loop: Wait up to 30 seconds for the tunnel to open
          $url = $null
          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              try {
                  $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -TimeoutSec 2 -ErrorAction Stop
                  if ($response.tunnels.Count -gt 0) {
                      $url = $response.tunnels[0].public_url
                      break
                  }
              } catch {
                  Write-Host "Waiting for ngrok to initialize... ($($i * 2)s)"
              }
          }

          # 7. Check result or dump debug logs if it failed
          if ($url) {
              Write-Host "=========================================="
              Write-Host "RDP ADDRESS: $url"
              Write-Host "=========================================="
          } else {
              Write-Host "Failed to establish tunnel. ngrok output:"
              Get-Content "ngrok.log" -ErrorAction SilentlyContinue
              Get-Content "ngrok_err.log" -ErrorAction SilentlyContinue
              exit 1
          }

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "RDP session ready. Runner will stay alive for 1 hour..."
          Start-Sleep -Seconds 3600
