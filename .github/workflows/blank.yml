name: Windows RDP Debugging

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Configure RDP and Bore Tunnel
        shell: powershell
        run: |
          # 1. User and RDP configuration
          Write-Host "Configuring user credentials..."
          net user runneradmin "P@ssw0rd1234!"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue

          # 2. Enable Remote Desktop and disable NLA
          Write-Host "Enabling RDP..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 3. Download standalone bore CLI (no account or card required)
          Write-Host "Downloading bore tunnel..."
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "$PWD" -Force

          # 4. Start bore tunnel on port 3389
          Write-Host "Starting TCP tunnel..."
          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore.log" -RedirectStandardError "bore_err.log"

          # 5. Extract assigned public port from log
          $address = $null
          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "bore.log") {
                  $content = Get-Content "bore.log" -Raw
                  if ($content -match 'listening at (bore\.pub:\d+)') {
                      $address = $matches[1]
                      break
                  }
              }
              Write-Host "Waiting for tunnel assignment... ($($i * 2)s)"
          }

          # 6. Display connection info
          if ($address) {
              Write-Host ""
              Write-Host "=========================================="
              Write-Host "RDP ADDRESS : $address"
              Write-Host "USERNAME    : runneradmin"
              Write-Host "PASSWORD    : P@ssw0rd1234!"
              Write-Host "=========================================="
              Write-Host ""
          } else {
              Write-Host "Failed to launch bore tunnel. Logs:"
              Get-Content "bore.log" -ErrorAction SilentlyContinue
              Get-Content "bore_err.log" -ErrorAction SilentlyContinue
              exit 1
          }

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "RDP session active. Keeping runner alive for 60 minutes..."
          Start-Sleep -Seconds 3600
