name: Windows RDP Debugging

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Set Up RDP and Tunnel
        shell: powershell
        run: |
          # 1. Set admin password
          net user runneradmin "P@ssw0rd1234!"

          # 2. Enable Remote Desktop (in case it is disabled)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 3. Install ngrok via Chocolatey (native and reliable on Windows runners)
          choco install ngrok -y

          # 4. Authenticate ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

          # 5. Start ngrok in background
          Start-Process ngrok -ArgumentList "tcp 3389"

          # 6. Wait for the tunnel to initialize
          Start-Sleep -Seconds 5

          # 7. Print the public URL
          $tunnel = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
          $publicUrl = $tunnel.tunnels[0].public_url
          Write-Host "=========================================="
          Write-Host "RDP ADDRESS: $publicUrl"
          Write-Host "=========================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "RDP session ready. Runner will stay alive for 1 hour..."
          Start-Sleep -Seconds 3600
